name: Feature request
description: Suggest an improvement to SEO Control Center
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the SEO task or situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like SEOcc to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle this today?
  - type: dropdown
    id: cost
    attributes:
      label: Would this need a paid API?
      options:
        - No, it uses data SEOcc already has
        - Yes
        - Not sure
